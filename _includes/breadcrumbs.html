{% comment %}
  Genera breadcrumbs visibles + BreadcrumbList schema.org según el layout de la página.
{% endcomment %}
<nav class="breadcrumbs" aria-label="Ruta de navegación">
  <ol>
    <li><a href="/">Inicio</a></li>
    {% if page.layout == "servicio" %}<li><a href="/servicios/">Servicios</a></li>{% endif %}
    {% if page.layout == "post" %}<li><a href="/blog/">Blog</a></li>{% endif %}
    <li aria-current="page">{{ page.title }}</li>
  </ol>
</nav>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {% if page.layout == "servicio" %}
    {"@type":"ListItem","position":1,"name":"Inicio","item":"{{ site.url }}/"},
    {"@type":"ListItem","position":2,"name":"Servicios","item":"{{ site.url }}/servicios/"},
    {"@type":"ListItem","position":3,"name":"{{ page.title }}","item":"{{ page.url | absolute_url }}"}
    {% elsif page.layout == "post" %}
    {"@type":"ListItem","position":1,"name":"Inicio","item":"{{ site.url }}/"},
    {"@type":"ListItem","position":2,"name":"Blog","item":"{{ site.url }}/blog/"},
    {"@type":"ListItem","position":3,"name":"{{ page.title }}","item":"{{ page.url | absolute_url }}"}
    {% else %}
    {"@type":"ListItem","position":1,"name":"Inicio","item":"{{ site.url }}/"},
    {"@type":"ListItem","position":2,"name":"{{ page.title }}","item":"{{ page.url | absolute_url }}"}
    {% endif %}
  ]
}
</script>
