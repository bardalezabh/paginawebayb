<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="{{ site.company.short_name }} — Inicio">
      <img src="/assets/img/logo.png" alt="{{ site.company.short_name }}" width="180" height="100" class="brand-logo">
    </a>

    <nav class="main-nav" id="main-nav" aria-label="Navegación principal">
      <ul>
        <li><a href="/">Inicio</a></li>
        <li><a href="/nosotros/">Nosotros</a></li>
        <li class="has-dropdown">
          <a href="/servicios/">Servicios <svg class="chev" width="12" height="12"><use href="#icon-chevron"/></svg></a>
          <ul class="dropdown">
            {% assign servicios = site.servicios | sort: "order" %}
            {% for s in servicios %}
            <li>
              <a href="{{ s.url }}">
                <svg width="18" height="18" aria-hidden="true"><use href="#{{ s.icon }}"/></svg>
                {{ s.nav_title }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </li>
        <li><a href="/blog/">Blog</a></li>
        <li><a href="/contacto/">Contacto</a></li>
      </ul>
    </nav>

    <div class="header-cta">
      <a href="tel:{{ site.company.phone_e164 }}" class="header-phone">
        <svg width="18" height="18" aria-hidden="true"><use href="#icon-phone"/></svg>
        <span>{{ site.company.phone_display }}</span>
      </a>
      <a href="https://wa.me/{{ site.company.whatsapp_number }}?text=Hola%20AYB%2C%20quisiera%20cotizar%20un%20servicio" class="btn btn-whatsapp" target="_blank" rel="noopener">
        <svg width="18" height="18" aria-hidden="true"><use href="#icon-whatsapp"/></svg>
        WhatsApp
      </a>
    </div>

    <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-controls="main-nav" aria-label="Abrir menú">
      <svg width="26" height="26" aria-hidden="true"><use href="#icon-menu"/></svg>
    </button>
  </div>
</header>
